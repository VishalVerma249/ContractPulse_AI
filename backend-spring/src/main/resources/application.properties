# ContractPulse AI Spring Boot Configuration
server.port=8080

# PostgreSQL + pgvector Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/contractpulse
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Uploads (up to 50MB contracts)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ML & AI / Vector Embedding Configuration
contractpulse.openai.api-key=${OPENAI_API_KEY:}
contractpulse.embedding.dimension=1536

# MinIO / S3 Object Storage Configuration
contractpulse.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
contractpulse.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
contractpulse.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
contractpulse.minio.bucket=contracts
contractpulse.storage.local-dir=./storage/contracts
